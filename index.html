<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quote generator </title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="header"><h2 style="color:rgb(17, 18, 18)">Assalamu Alaikum</h2></div>

    <br><br>
    <div id="container">
        <h2>How are you feeling today?</h2>
        
        <br><br>=
       <div class="btn">
         <button  data-mood="sad">Sad 🙁</button>
        <button data-mood="hopeless">Hopeless 😔</button>
        <button data-mood="depressed">Depressed 😟</button>
        <br><br>
        <button data-mood="stressed">Stressed 🫨</button>
        <button data-mood="anxious">Anxious 😨</button>
       </div>
         </div>

<br> <br>
<br>

<div id="popup" class="popup">
    <div class="popup-content">
        <button id="close-btn">×</button>
        <h2 id="mood-title">Your Insight</h2>

        <p id="ayah-text"></p>

        <p id="ayah-reference"></p>

    </div>
</div>

    
    <br><br>
    <h2>Daily Insight 💫</h2>
    <div id="lower" class="daily">
        <p id="insights">"Verily,with hardship comes ease"</p>
        <br>
        <p id="reference">- Quran 94:5</p>

    </div>
</body>
<script src="script.js"></script>
</html>
